name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Clean build artifacts
        run: |
          rm -rf dist build
          find . -maxdepth 1 -name "*.egg-info" -exec rm -rf {} +

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Verify installation
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          url = "https://pypi.org/pypi/metdatapy/json"

          for attempt in range(1, 31):
              with urllib.request.urlopen(url, timeout=30) as response:
                  releases = json.load(response)["releases"]
              if version in releases and releases[version]:
                  print(f"metdatapy {version} is available on PyPI")
                  break
              print(f"Waiting for metdatapy {version} on PyPI (attempt {attempt}/30)")
              time.sleep(10)
          else:
              raise SystemExit(f"metdatapy {version} was not visible on PyPI after 5 minutes")
          PY
          pip install --no-cache-dir "metdatapy==${VERSION}"
          python -c "import metdatapy; print(f'MetDataPy {metdatapy.__version__} published successfully')"
